feature: 2026-05-15-sketch-messaging-frontend
created: 2026-05-15

steps:
  - action: "静态结构：搭 Vite/React 项目骨架和 Sketch Messaging Shell，占位数据能完整显示三工作区"
    exit_signal: "npm run build 通过，浏览器可见左侧 threads、中间消息流、右侧详情/设置区"
    status: done
  - action: "视觉系统：实现纸张纹理、手绘气泡、头像框、状态符号、输入区 notebook lines、响应式布局和基础动画"
    exit_signal: "桌面和移动视口下无重叠，消息新增/typing/bubble reveal 动画可见且不阻塞操作"
    status: done
  - action: "API 客户端：封装 chat/rag/workflow JSON 请求与 chat SSE 解析"
    exit_signal: "用 mock 或本地后端调用能覆盖成功与失败路径，错误能回到 UI"
    status: done
  - action: "Chat 接入：模式加载、普通聊天、流式聊天、工具事件、历史上下文接入消息流"
    exit_signal: "发送问题后能看到 user/assistant 气泡、typing 状态、chunk 增量和最终状态"
    status: done
  - action: "RAG 接入：支持查看扩展名/索引、创建 text/directory/files 索引、更新/删除索引、查询与来源展示"
    exit_signal: "data/rag_docs 示例目录可通过 UI 建索引并查询，错误路径有 bubble 展示"
    status: done
  - action: "Workflow 接入：支持启动学习流、提交答案、刷新状态、查看历史"
    exit_signal: "使用已有 index 启动流程后能看到 plan/quiz/current_step，提交答案后能展示评分或错误"
    status: done
  - action: "验证收尾：构建、lint/测试（若配置）、Playwright 视口检查、API 手工联调"
    exit_signal: "验收契约关键场景都有可观察证据"
    status: done

checks:
  - item: "前端 ChatMessage、ConversationThread、ApiClient、RagIndexSummary、StudyFlowViewModel、SketchThemeToken 概念落地且命名一致"
    source: 名词契约
    status: done
  - item: "Chat/RAG/Workflow 三工作区统一由 Sketch Messaging Shell 编排"
    source: 编排骨架
    status: done
  - item: "API success=false 或 SSE error 会保留用户消息并标记失败 bubble"
    source: 流程级约束
    status: done
  - item: "SSE 请求在组件卸载或切换时可清理，避免 stale chunk 写入新线程"
    source: 流程级约束
    status: done
  - item: "前端入口、Vite 配置、UI 根壳、API base 配置四个挂载点存在"
    source: 挂载点
    status: done
  - item: "不新增或修改后端 API"
    source: 范围守护
    status: done
  - item: "不调用不存在的上传 API，不引入登录或实时多人通信依赖"
    source: 范围守护
    status: done
  - item: "页面显示 sketch messaging shell，左侧 threads、中间消息流、右侧详情区清晰可用"
    source: 验收场景
    status: done
  - item: "普通聊天和流式聊天均能产生 sent/received bubbles、typing 状态和错误状态"
    source: 验收场景
    status: done
  - item: "RAG 索引列表、创建、查询、来源/文档展开和错误展示可用"
    source: 验收场景
    status: done
  - item: "Study Flow 启动、答题、状态和历史展示可用"
    source: 验收场景
    status: done
  - item: "移动端无文字溢出、遮挡或 incoherent overlap"
    source: 验收场景
    status: done
  - item: "npm run build 成功"
    source: 验收场景
    status: done
